name: MarkText
options:
  bundleIdPrefix: io.github.greenerycomplexity
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  MarkTextKit:
    path: Packages/MarkTextKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"   # ad-hoc by default; set your own in Config/Signing.local.xcconfig
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  MarkText:
    type: application
    platform: macOS
    sources:
      - path: Sources/MarkText
      # Optional icon, produced by another agent. Scripts/generate.sh decides whether it is present.
      - path: Resources/AppIcon.icon
        optional: true
        buildPhase: resources
    dependencies:
      - package: MarkTextKit
        product: MarkTextKit
      - target: MarkTextQuickLook
        embed: true
        codeSign: true
    info:
      path: Config/MarkText-Info.plist
      properties:
        CFBundleName: MarkText
        CFBundleDisplayName: MarkText
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Copyright 2026 MarkText contributors
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mmd, mdown, mdtxt, mdtext]
              public.mime-type: [text/markdown]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
    entitlements:
      path: Config/MarkText.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.greenerycomplexity.MarkText
        PRODUCT_NAME: MarkText
        INFOPLIST_FILE: Config/MarkText-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/MarkText.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ${APPICON_NAME}

  MarkTextQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/MarkTextQuickLook
    dependencies:
      - package: MarkTextKit
        product: MarkTextKit
      - sdk: QuickLookUI.framework
    info:
      path: Config/MarkTextQuickLook-Info.plist
      properties:
        CFBundleName: MarkText Quick Look
        CFBundleDisplayName: MarkText Quick Look
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportedContentTypes: [net.daringfireball.markdown]
            QLSupportsSearchableItems: false
            QLPreviewWidth: 900
            QLPreviewHeight: 700
    entitlements:
      path: Config/MarkTextQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.greenerycomplexity.MarkText.QuickLook
        PRODUCT_NAME: MarkTextQuickLook
        INFOPLIST_FILE: Config/MarkTextQuickLook-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/MarkTextQuickLook.entitlements
        SKIP_INSTALL: YES

schemes:
  MarkText:
    build:
      targets:
        MarkText: all
    run:
      config: Debug
      commandLineArguments: {}
    test:
      config: Debug
      testTargets:
        - package: MarkTextKit/MarkTextKitTests
    profile:
      config: Release
    archive:
      config: Release
